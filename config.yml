version: 2.1

executors:
  java-executor:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/app

jobs:
  build:
    executor: java-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-repo-{{ checksum "pom.xml" }}
      - run:
          name: Build and Test
          command: mvn clean install
      - save_cache:
          paths:
            - ~/.m2
          key: maven-repo-{{ checksum "pom.xml" }}

  test:
    executor: java-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - maven-repo-{{ checksum "pom.xml" }}
      - run:
          name: Run Tests
          command: mvn test

  deploy:
    executor: java-executor
    steps:
      - checkout
      - run:
          name: Deploy Application
          command: echo "Deploying application..."  # Replace with actual deployment command

workflows:
  version: 2
  build_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - deploy:
          requires:
            - test
          filters:
            branches:
              only: main
